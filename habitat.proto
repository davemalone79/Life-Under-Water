syntax = "proto3";

package habitat;

// ---------------------- REQUESTS ----------------------
message HabitatStatusRequest {
  string area_id = 1;
}

message OrganismRequest {
  string area_id = 1;
}

// ---------------------- RESPONSES ----------------------
message HabitatStatusResponse {
  string area_id = 1;
  double temperature_c = 2;
  double oxygen_ppm = 3;
  double pressure_kpa = 4;
  string status = 5;
}

message Organism {
  string name = 1;
  string type = 2;
  int32 population = 3;
}

message OrganismListResponse {
  string area_id = 1;
  repeated Organism organisms = 2;
}

// ---------------------- SERVICE ----------------------
service HabitatService {
  rpc GetHabitatStatus (HabitatStatusRequest) returns (HabitatStatusResponse);
  rpc GetOrganisms (OrganismRequest) returns (OrganismListResponse);
}
