syntax = "proto3";

package navigation;

service NavigationService {
  rpc CalculateRoute (RouteRequest) returns (RouteResponse);
  rpc StreamSonarMap (SonarRequest) returns (stream SonarReading);
  rpc UploadWaypoints (stream Waypoint) returns (WaypointAck);
  rpc LiveNavigation (stream NavigationCommand) returns (stream NavigationUpdate);

  // NEW SAFETY RPC
  rpc CheckNavigationSafety (NavigationSafetyRequest) returns (NavigationSafetyResponse);
}

message RouteRequest {
  string origin = 1;
  string destination = 2;
}

message RouteResponse {
  string origin = 1;
  string destination = 2;
  double distance_km = 3;
  string estimated_time = 4;
}

message SonarRequest {
  string area_id = 1;
}

message SonarReading {
  string area_id = 1;
  double depth = 2;
  double temperature = 3;
  string timestamp = 4;
}

message Waypoint {
  string id = 1;
  double latitude = 2;
  double longitude = 3;
  double depth = 4;
}

message WaypointAck {
  int32 total_received = 1;
  bool success = 2;
}

message NavigationCommand {
  string command_type = 1;
  double value = 2;
}

message NavigationUpdate {
  string status = 1;
  string timestamp = 2;
}

// NEW SAFETY REQUEST
message NavigationSafetyRequest {
  string area_id = 1;
  double current_depth = 2;
  double distance_from_border = 3;
}

// NEW SAFETY RESPONSE
message NavigationSafetyResponse {
  string area_id = 1;
  string border_warning = 2;
  string depth_warning = 3;
  string recommended_action = 4;
}
