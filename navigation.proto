syntax = "proto3";

package navigation;

message SafetyCheckRequest {
  string area_id = 1;
  double current_depth = 2;
  double distance_from_border = 3;
}

message SafetyCheckResponse {
  string area_id = 1;
  bool is_safe = 2;
  string reason = 3;
}

message TransportModesRequest {}

message TransportMode {
  string name = 1;
  int32 capacity = 2;
  int32 max_depth = 3;
}

message TransportModesResponse {
  repeated TransportMode modes = 1;
}

service NavigationService {
  rpc CheckNavigationSafety (SafetyCheckRequest) returns (SafetyCheckResponse);
  rpc GetTransportModes (TransportModesRequest) returns (TransportModesResponse);
}
